# Query strings and referrers may contain verification tokens.
log_format convox '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log convox;

upstream backend {
    zone backend 64k;
    resolver 127.0.0.11 valid=5s;
    server server-1:4000 resolve max_fails=1 fail_timeout=5s;
    server server-2:4000 resolve max_fails=1 fail_timeout=5s;
    server server-3:4000 resolve max_fails=1 fail_timeout=5s;
}

upstream frontend {
    zone frontend 64k;
    resolver 127.0.0.11 valid=5s;
    server web:3000 resolve;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;
    # Eject reachable-but-unready peers; never enable non_idempotent POST replay.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    location /internal/ { return 404; }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location = /api/auth/verify-email {
        # Upstream error logs can include the full request URL, including its token.
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/auth/reset-password {
        # Reset callback paths and query strings can contain private tokens.
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location = /reset-password {
        access_log off;
        error_log /dev/null crit;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
