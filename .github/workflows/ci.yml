name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Create an ephemeral local auth secret
        run: node -e 'require("node:fs").writeFileSync(".env", "SMTP_HOST=mailpit\nSMTP_PORT=1025\nSMTP_TLS=local\nSMTP_FROM=convox@example.com\nBETTER_AUTH_URL=http://localhost:8080\nBETTER_AUTH_SECRET=" + require("node:crypto").randomBytes(32).toString("base64") + "\n")'
      - run: docker compose --profile stack config --quiet
      - run: docker compose --profile mail up -d mailpit
      - run: pnpm stack:up
      - run: docker compose exec -T server-1 pnpm --filter @convox/server db:migrate
      - run: pnpm test:smoke
      - name: Verify SMTP outage behavior
        run: |
          trap 'docker compose start mailpit' EXIT
          docker compose stop mailpit
          docker compose exec -T server-1 node tests/integration/email-unavailable.mjs
      - run: pnpm test:auth
      - run: pnpm test:conversations
      - run: pnpm test:messages
      - run: pnpm test:realtime
      - run: pnpm test:client-sync
      - if: failure()
        run: docker compose --profile stack logs --tail=100
      - if: always()
        run: docker compose --profile stack --profile mail down
