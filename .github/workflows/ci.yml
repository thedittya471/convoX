name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit, security, configuration and isolated integration checks
        run: pnpm test:ci
      - name: Preserve sanitized check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: test-results/ci/
          if-no-files-found: ignore
          retention-days: 7
